<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chauffeur playground</title>
  </head>
  <body>
    <main v-scope v-cloak>
      <h1>Chauffeur playground <small>{{ version }}</small></h1>
      <p v-if="!features.length">No feature tabs yet.</p>
      <wa-tab-group v-else :active="selected" @wa-tab-show="show($event.detail.name)">
        <wa-tab v-for="feature in features" :key="feature.id" slot="nav" :panel="feature.id">{{ feature.title }}</wa-tab>
        <wa-tab-panel v-for="feature in features" :key="feature.id" :name="feature.id">
          <div v-scope="feature.view()"></div>
        </wa-tab-panel>
      </wa-tab-group>
    </main>

    <!-- One template per feature, named by its view's `$template`. -->
    <template id="question">
      <div class="wa-grid">
        <div class="wa-stack">
          <!-- Choose by `selected`, not `:value`: petite-vue's value binding also writes `el._value`, which wa-select keeps as an array. -->
          <wa-select label="Example" @change="load($event.target.value)">
            <wa-option v-for="name in names" :key="name" :value="name" :selected="name === example">{{ name }}</wa-option>
          </wa-select>
          <wa-textarea label="Question" hint="outcomes in order; p for every outcome; confidence: a bar, a bar per outcome, or none for the likeliest" :value="source" @input="update($event.target.value)" rows="12" spellcheck="false"></wa-textarea>
        </div>
        <div class="wa-stack">
          <wa-callout v-if="result && 'error' in result" variant="danger">{{ result.error }}</wa-callout>
          <wa-card v-else-if="result">
            <span slot="header">Settles to</span>
            <div class="wa-stack">
              <wa-badge v-if="'failed' in result" variant="danger" class="settled">failed: {{ result.failed }}</wa-badge>
              <template v-else>
                <wa-badge :variant="result.answer.outcome === 'unsure' ? 'warning' : 'brand'" class="settled">{{ result.answer.outcome }}</wa-badge>
                <ul class="probabilities">
                  <li v-for="line in result.answer.p" :key="line.outcome"><code>{{ line.outcome }}</code> {{ line.p }}</li>
                </ul>
                <small>level {{ result.answer.level.toFixed(2) }}</small>
              </template>
            </div>
          </wa-card>
        </div>
      </div>
    </template>

    <template id="navigate">
      <div class="wa-grid">
        <div class="wa-stack">
          <wa-select label="Example" @change="load($event.target.value)">
            <wa-option v-for="name in names" :key="name" :value="name" :selected="name === example">{{ name }}</wa-option>
          </wa-select>
          <wa-textarea label="Request, rules and stand-in replies" hint="request: the chauffeur.navigate params; rules: rule files by ID; answers: each step's p, or { failed }" :value="source" @input="update($event.target.value)" rows="24" spellcheck="false"></wa-textarea>
        </div>
        <div class="wa-stack">
          <wa-callout v-if="result && 'error' in result" variant="danger">{{ result.error }}</wa-callout>
          <wa-card v-else-if="result && 'rejected' in result">
            <span slot="header">Rejected</span>
            <div class="wa-stack">
              <wa-badge variant="danger" class="settled">{{ result.rejected.data.reason }}</wa-badge>
              <span>{{ result.rejected.message }}</span>
              <pre>{{ pretty(result.rejected) }}</pre>
            </div>
          </wa-card>
          <template v-else-if="result">
            <wa-card>
              <span slot="header">Events, as the caller receives them</span>
              <ol class="events">
                <li v-for="(event, index) in result.events" :key="index"><code>{{ event.event }}</code> <pre>{{ pretty(event) }}</pre></li>
              </ol>
            </wa-card>
            <wa-card>
              <span slot="header">Result</span>
              <div class="wa-stack">
                <wa-badge v-if="result.result.intents && result.result.intents.length" variant="warning" class="settled">{{ result.result.intents.map((intent) => Object.keys(intent).filter((key) => key !== 'rule').join(', ')).join('; ') }}</wa-badge>
                <wa-badge v-else-if="result.result.intents" variant="success" class="settled">no intent: the caller's default</wa-badge>
                <pre>{{ pretty(result.result) }}</pre>
                <wa-callout v-for="reason in result.refused || []" :key="reason" variant="danger">{{ reason }}</wa-callout>
              </div>
            </wa-card>
          </template>
        </div>
      </div>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
