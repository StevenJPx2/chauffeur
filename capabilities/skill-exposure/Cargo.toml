[package]
name = "chauffeur-capability-skill-exposure"
description = "Chauffeur capability: preload relevant skills into the user's message"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
sources = ["dep:tokio", "dep:reqwest", "dep:yaml_serde", "dep:thiserror"]

[dependencies]
chauffeur-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs"], optional = true }
reqwest = { workspace = true, features = ["rustls-tls"], optional = true }
yaml_serde = { version = "=0.10.7", optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
axum = { workspace = true }

[lints]
workspace = true
