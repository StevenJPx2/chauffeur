name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: adapters/opencode/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
        working-directory: adapters/opencode
      - run: npm run check
        working-directory: adapters/opencode
      - run: npm run build
        working-directory: adapters/opencode
      - run: node --test scripts/*.test.mjs
      - name: Build native daemon
        run: cargo build --release --locked -p chauffeur-cli
      - name: Package and smoke-test
        shell: bash
        run: |
          set -euo pipefail
          target=$(node --input-type=module -e 'console.log(`${process.platform}-${process.arch}`)')
          node scripts/package.mjs tarball --target "$target" --binary target/release/chauffeur --out dist
          node scripts/package.mjs sums dist
          node scripts/smoke.mjs dist/chauffeur-*.tar.gz
      - name: Offline benchmark checks
        run: cargo run --locked -p chauffeur-bench -- verify
