[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/judges",
  "crates/protocol",
  "crates/runtime",
  "crates/daemon",
  "crates/cli",
  "playground/wasm",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.96"
publish = false
repository = "https://github.com/StevenJPx2/chauffeur"

[workspace.dependencies]
chauffeur-core = { path = "crates/core" }
chauffeur-judges = { path = "crates/judges" }
chauffeur-protocol = { path = "crates/protocol" }
chauffeur-runtime = { path = "crates/runtime" }
chauffeur-daemon = { path = "crates/daemon" }
clap = { version = "4", features = ["derive"] }
color-eyre = { version = "0.6", default-features = false }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Explicit panics
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
exit = "deny"
dbg_macro = "deny"
# Implicit panics
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
as_conversions = "deny"
# Size
too_many_lines = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
