name: Check

on:
  push:
    branches: [v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      # -D warnings reaches rustc and clippy only; this fails Cargo's own lints too.
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the nightly and its components; rustup installs them here.
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p chauffeur-judges --no-default-features --all-targets --locked -- -D warnings
      - run: cargo clippy -p chauffeur-playground --target wasm32-unknown-unknown --locked -- -D warnings
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked
      # Each benchmark once, so they keep building and running; timings are compared locally.
      - run: cargo bench --workspace --bench '*' --locked -- -benchtime 1x -count 1

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The rust-version in Cargo.toml, exactly; the pinned nightly stays for the rest.
      - run: rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.100.0 check --workspace --all-targets --locked
      - run: cargo +1.100.0 check -p chauffeur-judges --no-default-features --all-targets --locked
      - run: cargo +1.100.0 check -p chauffeur-playground --target wasm32-unknown-unknown --locked

  # The proofs run on GitHub's disposable runners, never on a developer's
  # machine: they execute generated code and the tests spawn processes.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo miri setup
      - run: cargo miri test -p chauffeur-core --locked

  kani:
    runs-on: ubuntu-latest
    env:
      KANI_VERSION: 0.68.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Kani brings its own nightly; the pinned one stays for the rest.
      - run: cargo install --locked kani-verifier --version "$KANI_VERSION"
      - run: cargo kani setup
      - run: cargo kani -p chauffeur-judges

  # Every viable mutant in the lines a pull request changes must be caught;
  # an equivalent one is excluded in .cargo/mutants.toml, with why.
  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-mutants,cargo-nextest
      - name: The pull request's diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff "$BASE"...HEAD -- '*.rs' > pr.diff
      # Exit 3 is timeouts and nothing missed: a mutant that hangs the tests is
      # caught by them, as the audits count it. Exit 2, a missed mutant, fails.
      - name: cargo mutants
        run: cargo mutants --in-diff pr.diff --no-shuffle -vV || test $? -eq 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: mutants.out

  opencode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/opencode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: node --test scripts/*.test.mjs
      - run: cargo build --release --locked -p chauffeur-cli
      - name: Build the OpenCode adapter
        working-directory: adapters/opencode
        run: bun install --frozen-lockfile && bun run build
      - name: Package and smoke-test
        shell: bash
        run: |
          set -euo pipefail
          target=$(node -p 'process.platform + "-" + process.arch')
          node scripts/package.mjs tarball --target "$target" --binary target/release/chauffeur --out dist
          node scripts/package.mjs sums dist
          node scripts/smoke.mjs dist/chauffeur-*.tar.gz
