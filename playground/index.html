<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chauffeur playground</title>
  </head>
  <body>
    <main v-scope v-cloak>
      <h1>Chauffeur playground <small>{{ version }}</small></h1>
      <p v-if="!features.length">No feature tabs yet.</p>
      <wa-tab-group v-else :active="selected" @wa-tab-show="show($event.detail.name)">
        <wa-tab v-for="feature in features" :key="feature.id" slot="nav" :panel="feature.id">{{ feature.title }}</wa-tab>
        <wa-tab-panel v-for="feature in features" :key="feature.id" :name="feature.id">
          <div v-scope="feature.view()"></div>
        </wa-tab-panel>
      </wa-tab-group>
    </main>

    <!-- One template per feature, named by its view's `$template`. -->

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
