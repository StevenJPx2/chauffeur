[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/daemon",
  "crates/mcp",
  "crates/cli",
  "plugins/anthropic",
  "plugins/openai",
  "capabilities/model-router",
  "capabilities/skill-exposure",
  "capabilities/tool-exposure",
  "capabilities/permission",
  "capabilities/rules",
  "capabilities/event-gate",
  "judges/jev",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/StevenJPx2/chauffeur"

[workspace.dependencies]
chauffeur-core = { path = "crates/core", default-features = false }
chauffeur-daemon = { path = "crates/daemon" }
chauffeur-mcp = { path = "crates/mcp" }
chauffeur-judge-jev = { path = "judges/jev" }
chauffeur-plugin-anthropic = { path = "plugins/anthropic" }
chauffeur-plugin-openai = { path = "plugins/openai" }
chauffeur-capability-model-router = { path = "capabilities/model-router" }
chauffeur-capability-skill-exposure = { path = "capabilities/skill-exposure" }
chauffeur-capability-tool-exposure = { path = "capabilities/tool-exposure" }
chauffeur-capability-permission = { path = "capabilities/permission" }
chauffeur-capability-rules = { path = "capabilities/rules" }
chauffeur-capability-event-gate = { path = "capabilities/event-gate" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "process", "time", "net"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
